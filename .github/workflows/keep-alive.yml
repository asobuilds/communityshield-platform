name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf --max-time 90 https://nativityguard-backend.onrender.com/health || echo "ping failed (will retry next run)"
      - name: Ping frontend
        run: |
          curl -sf --max-time 30 https://nativityguard-frontend.onrender.com/ || echo "frontend ping failed"
